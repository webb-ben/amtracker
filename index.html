<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amtracker Map</title>
    <link id="favicon" rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="src/app.css" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
  </head>
  <body>
    <div id="map"></div>

    <aside id="panel">
      <header>
        <div class="brand">
          <canvas class="logo" width="16" height="16" aria-hidden="true"></canvas>
          <div>
            <h1>Amtracker</h1>
            <p id="status">Loading…</p>
          </div>
        </div>
        <div class="tools">
          <button id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
          <button id="panel-toggle" title="Collapse panel" aria-label="Collapse panel">▾</button>
        </div>
      </header>
      <div class="panel-body">
        <div id="list-view">
          <input id="search" type="search" placeholder="Search train #, route, or station" autocomplete="off" />
          <ul class="legend" aria-label="Map key">
            <li><span class="swatch amtrak"></span>Amtrak route</li>
            <li><span class="swatch freight"></span>Freight rail</li>
            <li><span class="swatch passenger"></span>Passenger-only</li>
            <li class="legend-toggle">
              <label><input id="trains-toggle" type="checkbox" checked /> Show trains</label>
              <label><input id="speed-toggle" type="checkbox" /> Speed heatmap (30 days)</label>
            </li>
          </ul>
          <div id="speed-info" class="speed-info" hidden></div>
          <div id="train-list"></div>
        </div>
        <div id="detail"></div>
      </div>
    </aside>

    <div id="board" hidden></div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
